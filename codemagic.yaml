workflows:
  godot-ios:
    name: Godot iOS Build
    max_build_duration: 60

    environment:
      vars:
        GODOT_VERSION: "4.2.1"

    scripts:
      # 🔧 1. Limpar cache (resolve UID errors)
      - name: Clean Godot cache
        script: |
          rm -rf .godot
          rm -rf .import

      # 📥 2. Baixar Godot (macOS)
      - name: Download Godot
        script: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -o Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      # 📦 3. Instalar templates (FIX REAL)
      - name: Install export templates
        script: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -o Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          
          # copia somente o necessário (IMPORTANTE)
          cp templates/ios.zip ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/

      # 🛠️ 4. Exportar projeto iOS
      - name: Export iOS project
        script: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios

    artifacts:
      - build/ios/**