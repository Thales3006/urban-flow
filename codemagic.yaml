workflows:
  godot-ios:
    name: Godot iOS (Export Project)
    max_build_duration: 60

    environment:
      vars:
        GODOT_VERSION: "4.2.1"

    scripts:
      - name: Download Godot (macOS)
        script: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip Godot_v${GODOT_VERSION}-stable_macos.universal.zip

      - name: Download export templates
        script: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable

      - name: Make Godot executable
        script: |
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Export iOS project
        script: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios

    artifacts:
      - build/ios/**